<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB Monitor Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .btn-primary {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
        }
        .btn-secondary {
            background-color: var(--tg-theme-hint-color, #999);
            color: #fff;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
        }
    </style>
</head>
<body class="p-4">
    <div id="app">
        <!-- Dashboard will be rendered here via A2UI -->
        <div class="flex items-center justify-center h-64">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function fetchDashboard() {
            try {
                const response = await fetch('/api/dashboard', {
                    headers: {
                        'X-Telegram-Init-Data': tg.initData
                    }
                });
                const data = await response.json();
                renderA2UI(data);
            } catch (error) {
                console.error('Failed to fetch dashboard:', error);
                document.getElementById('app').innerHTML = '<p class="text-red-500">Ошибка загрузки данных</p>';
            }
        }

        async function handleAction(eventId, componentId) {
            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': tg.initData
                    },
                    body: JSON.stringify({ event: eventId, component_id: componentId })
                });
                const data = await response.json();
                renderA2UI(data);
            } catch (error) {
                console.error('Action failed:', error);
            }
        }

        function renderA2UI(a2ui) {
            const root = document.getElementById('app');
            root.innerHTML = '';
            
            // Simplified recursive renderer for A2UI components
            const components = a2ui.ui.components;
            const rootId = a2ui.ui.root;
            
            const renderComponent = (id) => {
                const comp = components.find(c => c.id === id);
                if (!comp) return '';

                let html = '';
                const props = comp.properties || {};

                switch (comp.type) {
                    case 'Container':
                        html = `<div class="container" style="padding: ${props.padding || '0'}">
                            ${(comp.children || []).map(renderComponent).join('')}
                        </div>`;
                        break;
                    case 'Header':
                        html = `<div class="mb-6">
                            <h1 class="text-2xl font-bold">${props.icon || ''} ${props.title}</h1>
                            <p class="text-sm opacity-60">${props.subtitle}</p>
                        </div>`;
                        break;
                    case 'StatsRow':
                        html = `<div class="grid grid-cols-2 gap-4 mb-6">
                            ${props.items.map(item => `
                                <div class="card flex flex-col items-center">
                                    <span class="text-2xl">${item.icon}</span>
                                    <span class="text-xl font-bold">${item.value}</span>
                                    <span class="text-xs opacity-60 uppercase">${item.label}</span>
                                </div>
                            `).join('')}
                        </div>`;
                        break;
                    case 'Grid':
                        html = `<div class="grid grid-cols-${props.columns} gap-4">
                            ${(comp.children || []).map(renderComponent).join('')}
                        </div>`;
                        break;
                    case 'Card':
                        html = `<div class="card flex flex-col shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg">${props.title}</h3>
                                <span class="text-xs px-2 py-1 rounded ${props.metadata.is_active ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}">
                                    ${props.metadata.is_active ? 'Активен' : 'Пауза'}
                                </span>
                            </div>
                            <p class="text-sm mb-4 opacity-80">${props.description}</p>
                            <div class="flex gap-2">
                                ${props.actions.map(action => {
                                    if (action.type === 'button') {
                                        return `<button onclick="handleAction('${action.event}', '${action.id}')" class="${action.style === 'primary' ? 'btn-primary' : 'btn-secondary'} text-sm flex-1">
                                            ${action.label}
                                        </button>`;
                                    } else {
                                        return `<a href="${action.url}" target="_blank" class="btn-secondary text-sm flex-1 text-center">
                                            ${action.label}
                                        </a>`;
                                    }
                                }).join('')}
                            </div>
                        </div>`;
                        break;
                    case 'EmptyState':
                        html = `<div class="flex flex-col items-center justify-center py-12 text-center opacity-60">
                            <span class="text-5xl mb-4">${props.icon}</span>
                            <h3 class="text-xl font-bold">${props.title}</h3>
                            <p>${props.message}</p>
                        </div>`;
                        break;
                }
                return html;
            };

            root.innerHTML = renderComponent(rootId);
        }

        fetchDashboard();
    </script>
</body>
</html>
