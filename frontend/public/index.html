<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            padding: 16px;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--tg-theme-hint-color, #e0e0e0);
            border-top-color: var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            text-align: center;
            padding: 32px;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .stat-icon {
            font-size: 24px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(51, 144, 236, 0.1);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.6;
        }
        
        .track-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .track-title {
            font-weight: 600;
            font-size: 16px;
            flex: 1;
        }
        
        .track-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            margin-left: 8px;
        }
        
        .track-status.in-stock {
            background: rgba(52, 199, 89, 0.2);
            color: #34c759;
        }
        
        .track-status.out-of-stock {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
        }
        
        .track-info {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }
        
        .track-info-item {
            display: flex;
            flex-direction: column;
        }
        
        .track-info-label {
            font-size: 12px;
            opacity: 0.6;
        }
        
        .track-info-value {
            font-size: 18px;
            font-weight: 600;
        }
        
        .track-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .btn:active {
            opacity: 0.8;
        }
        
        .btn-primary {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        
        .btn-secondary {
            background: var(--tg-theme-hint-color, #c0c0c0);
            color: #ffffff;
        }
        
        .chart-container {
            margin-top: 12px;
            height: 150px;
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 8px;
            padding: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 48px 16px;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .header-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .header-subtitle {
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = ''; // Same origin
        
        function getInitData() {
            return tg.initData || '';
        }
        
        function formatPrice(price) {
            if (price === null || price === undefined) return '—';
            return price.toLocaleString('ru-RU') + ' ₽';
        }
        
        function formatRating(rating) {
            if (rating === null || rating === undefined) return '—';
            return rating.toFixed(1);
        }
        
        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'short'
            });
        }
        
        async function fetchDashboard() {
            try {
                const response = await fetch(API_URL + '/api/tracks', {
                    headers: {
                        'X-Telegram-Init-Data': getInitData()
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }
        
        async function toggleTrack(trackId) {
            try {
                const response = await fetch(API_URL + '/api/action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': getInitData()
                    },
                    body: JSON.stringify({
                        event: 'toggle',
                        track_id: trackId
                    })
                });
                
                return await response.json();
            } catch (error) {
                console.error('Toggle error:', error);
                throw error;
            }
        }
        
        function drawChart(container, data) {
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.5;padding:50px;">Нет данных</div>';
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            container.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const padding = { top: 20, right: 20, bottom: 30, left: 50 };
            const chartWidth = rect.width - padding.left - padding.right;
            const chartHeight = rect.height - padding.top - padding.bottom;
            
            const prices = data.map(d => d.price).filter(p => p !== null);
            const minPrice = Math.min(...prices) * 0.99;
            const maxPrice = Math.max(...prices) * 1.01;
            
            // Draw axes
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, rect.height - padding.bottom);
            ctx.lineTo(rect.width - padding.right, rect.height - padding.bottom);
            ctx.stroke();
            
            // Draw line
            ctx.strokeStyle = '#3390ec';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            const points = data.filter(d => d.price !== null).map((d, i, arr) => {
                const x = padding.left + (i / (arr.length - 1 || 1)) * chartWidth;
                const y = padding.top + chartHeight - ((d.price - minPrice) / (maxPrice - minPrice || 1)) * chartHeight;
                return { x, y, price: d.price, date: d.date };
            });
            
            if (points.length > 0) {
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach((point, i) => {
                    if (i > 0) ctx.lineTo(point.x, point.y);
                });
            }
            ctx.stroke();
            
            // Draw points
            points.forEach(point => {
                ctx.fillStyle = '#3390ec';
                ctx.beginPath();
                ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw Y-axis labels
            ctx.fillStyle = '#999';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(formatPrice(maxPrice), padding.left - 5, padding.top + 5);
            ctx.fillText(formatPrice(minPrice), padding.left - 5, rect.height - padding.bottom - 5);
        }
        
        function render() {
            const app = document.getElementById('app');
            
            fetchDashboard()
                .then(data => {
                    const { user, tracks } = data;
                    
                    const totalTracks = tracks.length;
                    const activeTracks = tracks.filter(t => t.is_active).length;
                    const inStockTracks = tracks.filter(t => t.in_stock).length;
                    
                    let html = `
                        <div class="header">
                            <div class="header-title">👋 Привет, ${user.first_name || user.username || 'Пользователь'}!</div>
                            <div class="header-subtitle">Тариф: ${user.plan.toUpperCase()}</div>
                        </div>
                        
                        <div class="stats">
                            <div class="stat-card">
                                <div class="stat-icon">📦</div>
                                <div>
                                    <div class="stat-value">${totalTracks}</div>
                                    <div class="stat-label">Всего</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">🔔</div>
                                <div>
                                    <div class="stat-value">${activeTracks}</div>
                                    <div class="stat-label">Активных</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">✅</div>
                                <div>
                                    <div class="stat-value">${inStockTracks}</div>
                                    <div class="stat-label">В наличии</div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    if (tracks.length === 0) {
                        html += `
                            <div class="empty-state">
                                <div class="empty-state-icon">🔍</div>
                                <div style="font-weight:600;margin-bottom:8px;">Нет товаров</div>
                                <div style="opacity:0.6;">Добавьте товары в боте</div>
                            </div>
                        `;
                    } else {
                        tracks.forEach(track => {
                            const history = track.history || [];
                            const chartId = `chart-${track.id}`;
                            
                            html += `
                                <div class="track-card">
                                    <div class="track-header">
                                        <div class="track-title">${track.title}</div>
                                        <span class="track-status ${track.in_stock ? 'in-stock' : 'out-of-stock'}">
                                            ${track.in_stock ? 'В наличии' : 'Нет в наличии'}
                                        </span>
                                    </div>
                                    
                                    <div class="track-info">
                                        <div class="track-info-item">
                                            <div class="track-info-label">Цена</div>
                                            <div class="track-info-value">${formatPrice(track.price)}</div>
                                        </div>
                                        <div class="track-info-item">
                                            <div class="track-info-label">Рейтинг</div>
                                            <div class="track-info-value">${formatRating(track.rating)}</div>
                                        </div>
                                    </div>
                                    
                                    <div class="track-actions">
                                        <button class="btn ${track.is_active ? 'btn-secondary' : 'btn-primary'}" 
                                                onclick="handleToggle(${track.id}, ${track.is_active})">
                                            ${track.is_active ? 'Пауза' : 'Включить'}
                                        </button>
                                        <a href="${track.url}" target="_blank" class="btn btn-secondary">
                                            Открыть на WB
                                        </a>
                                    </div>
                                    
                                    <div class="chart-container" id="${chartId}"></div>
                                </div>
                            `;
                            
                            // Draw chart after render
                            setTimeout(() => {
                                const container = document.getElementById(chartId);
                                if (container) {
                                    drawChart(container, history);
                                }
                            }, 0);
                        });
                    }
                    
                    app.innerHTML = html;
                    
                    // Handle theme changes
                    tg.onEvent('themeChanged', () => {
                        document.body.style.backgroundColor = 'var(--tg-theme-bg-color, #ffffff)';
                        document.body.style.color = 'var(--tg-theme-text-color, #000000)';
                    });
                })
                .catch(error => {
                    app.innerHTML = `
                        <div class="error">
                            <div class="error-icon">❌</div>
                            <div style="font-weight:600;margin-bottom:8px;">Ошибка загрузки</div>
                            <div style="opacity:0.6;margin-bottom:16px;">${error.message}</div>
                            <button class="btn btn-primary" onclick="location.reload()">Повторить</button>
                        </div>
                    `;
                });
        }
        
        function handleToggle(trackId, currentStatus) {
            tg.HapticFeedback.impactOccurred('light');
            toggleTrack(trackId).then(() => {
                render(); // Re-render to show updated status
            }).catch(err => {
                console.error('Toggle failed:', err);
                tg.showAlert('Не удалось изменить статус');
            });
        }
        
        // Start rendering
        render();
    </script>
</body>
</html>
