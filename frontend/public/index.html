<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="var(--tg-theme-bg-color, #ffffff)">
    <meta name="color-scheme" content="light dark">
    <title>WB Monitor</title>
    <!-- Telegram Web App SDK - must be loaded first -->
    <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
    <style>
        :root {
            /* Telegram theme variables */
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #3390ec);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --section-bg-color: var(--tg-theme-section-bg-color, #f5f5f5);
            
            /* Safe area insets */
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html {
            height: 100%;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100%;
            min-height: var(--tg-viewport-height, 100vh);
            padding: calc(16px + var(--safe-area-inset-top)) 16px calc(16px + var(--safe-area-inset-bottom));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: var(--tg-viewport-height, 100vh);
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--secondary-bg-color);
            border-top-color: var(--button-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error state */
        .error {
            text-align: center;
            padding: 32px 16px;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        /* Stats grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--secondary-bg-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .stat-icon {
            font-size: 24px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(51, 144, 236, 0.1);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.6;
        }
        
        /* Track cards */
        .track-card {
            background: var(--secondary-bg-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 8px;
        }
        
        .track-title {
            font-weight: 600;
            font-size: 16px;
            flex: 1;
            word-break: break-word;
        }
        
        .track-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }
        
        .track-status.in-stock {
            background: rgba(52, 199, 89, 0.2);
            color: #34c759;
        }
        
        .track-status.out-of-stock {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
        }
        
        .track-info {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }
        
        .track-info-item {
            display: flex;
            flex-direction: column;
        }
        
        .track-info-label {
            font-size: 12px;
            opacity: 0.6;
        }
        
        .track-info-value {
            font-size: 18px;
            font-weight: 600;
        }
        
        .track-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }
        
        .btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: var(--button-color);
            color: var(--button-text-color);
        }
        
        .btn-secondary {
            background: var(--hint-color);
            color: #ffffff;
        }
        
        .chart-container {
            margin-top: 12px;
            height: 150px;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 8px;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 16px;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        /* Header */
        .header {
            margin-bottom: 20px;
        }
        
        .header-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .header-subtitle {
            font-size: 14px;
            opacity: 0.6;
        }
        
        /* Links */
        a {
            color: var(--link-color);
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Inform Telegram that Mini App is ready (hides loading placeholder)
        tg.ready();
        
        // Expand to maximum available height
        tg.expand();
        
        // Enable closing confirmation if there are unsaved changes
        tg.enableClosingConfirmation();
        
        // Get initialization data (contains user info and auth data)
        const initData = tg.initData || '';
        const initDataUnsafe = tg.initDataUnsafe || {};
        
        // API configuration
        const API_URL = ''; // Same origin
        
        /**
         * Format price with ruble symbol
         */
        function formatPrice(price) {
            if (price === null || price === undefined) return '—';
            return price.toLocaleString('ru-RU') + ' ₽';
        }
        
        /**
         * Format rating with one decimal
         */
        function formatRating(rating) {
            if (rating === null || rating === undefined) return '—';
            return rating.toFixed(1);
        }
        
        /**
         * Format date as "DD Mon"
         */
        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'short'
            });
        }
        
        /**
         * Fetch dashboard data from API
         */
        async function fetchDashboard() {
            try {
                const response = await fetch(API_URL + '/api/tracks', {
                    method: 'GET',
                    headers: {
                        'X-Telegram-Init-Data': initData,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    const error = await response.json().catch(() => ({ detail: 'Failed to fetch data' }));
                    throw new Error(error.detail || `HTTP ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }
        
        /**
         * Toggle track active status
         */
        async function toggleTrack(trackId) {
            try {
                const response = await fetch(API_URL + '/api/action', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    },
                    body: JSON.stringify({
                        event: 'toggle',
                        track_id: trackId
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to toggle track');
                }
                
                return await response.json();
            } catch (error) {
                console.error('Toggle error:', error);
                throw error;
            }
        }
        
        /**
         * Draw price chart using Canvas API
         */
        function drawChart(container, data) {
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.5;padding:50px;font-size:12px;">Нет данных для отображения</div>';
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            container.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            // Set canvas size with device pixel ratio for sharp rendering
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            const padding = { top: 20, right: 15, bottom: 25, left: 45 };
            const chartWidth = rect.width - padding.left - padding.right;
            const chartHeight = rect.height - padding.top - padding.bottom;
            
            // Get price data
            const prices = data.map(d => d.price).filter(p => p !== null);
            if (prices.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.5;padding:50px;font-size:12px;">Нет данных о цене</div>';
                return;
            }
            
            const minPrice = Math.min(...prices) * 0.99;
            const maxPrice = Math.max(...prices) * 1.01;
            const priceRange = maxPrice - minPrice || 1;
            
            // Draw grid lines
            ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--secondary-bg-color') || '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            
            // Horizontal grid lines
            for (let i = 0; i <= 3; i++) {
                const y = padding.top + (i / 3) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(rect.width - padding.right, y);
                ctx.stroke();
            }
            
            ctx.setLineDash([]);
            
            // Draw price line
            ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--button-color') || '#3390ec';
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            
            const validData = data.filter(d => d.price !== null);
            const points = validData.map((d, i) => {
                const x = padding.left + (i / (validData.length - 1 || 1)) * chartWidth;
                const y = padding.top + chartHeight - ((d.price - minPrice) / priceRange) * chartHeight;
                return { x, y, price: d.price, date: d.date };
            });
            
            if (points.length > 0) {
                ctx.moveTo(points[0].x, points[0].y);
                
                // Draw smooth line
                for (let i = 1; i < points.length; i++) {
                    const xc = (points[i].x + points[i - 1].x) / 2;
                    const yc = (points[i].y + points[i - 1].y) / 2;
                    ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
            }
            ctx.stroke();
            
            // Draw data points
            points.forEach((point, i) => {
                // Only draw points for first, last, and every 5th point to avoid clutter
                if (i === 0 || i === points.length - 1 || i % 5 === 0) {
                    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--button-color') || '#3390ec';
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // Draw Y-axis labels
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--hint-color') || '#999';
            ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillText(formatPrice(maxPrice), padding.left - 5, padding.top - 2);
            ctx.textBaseline = 'bottom';
            ctx.fillText(formatPrice(minPrice), padding.left - 5, rect.height - padding.bottom + 2);
        }
        
        /**
         * Handle track toggle button click
         */
        function handleToggle(trackId, currentStatus, btnElement) {
            // Haptic feedback (if supported)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            
            // Optimistic UI update
            const wasActive = currentStatus;
            btnElement.textContent = currentStatus ? 'Пауза...' : 'Включить...';
            btnElement.disabled = true;
            
            toggleTrack(trackId)
                .then(() => {
                    // Re-render to show updated status
                    render();
                })
                .catch(err => {
                    console.error('Toggle failed:', err);
                    // Revert button state
                    btnElement.textContent = wasActive ? 'Пауза' : 'Включить';
                    btnElement.disabled = false;
                    
                    // Show error using Telegram's native alert
                    tg.showAlert('Не удалось изменить статус. Попробуйте еще раз.');
                });
        }
        
        /**
         * Main render function
         */
        function render() {
            const app = document.getElementById('app');
            
            fetchDashboard()
                .then(data => {
                    const { user, tracks } = data;
                    
                    // Calculate stats
                    const totalTracks = tracks.length;
                    const activeTracks = tracks.filter(t => t.is_active).length;
                    const inStockTracks = tracks.filter(t => t.in_stock).length;
                    
                    // Build HTML
                    let html = `
                        <div class="header">
                            <div class="header-title">👋 Привет, ${escapeHtml(user.first_name || user.username || 'Пользователь')}!</div>
                            <div class="header-subtitle">Тариф: ${escapeHtml(user.plan).toUpperCase()}</div>
                        </div>
                        
                        <div class="stats">
                            <div class="stat-card">
                                <div class="stat-icon">📦</div>
                                <div>
                                    <div class="stat-value">${totalTracks}</div>
                                    <div class="stat-label">Всего</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">🔔</div>
                                <div>
                                    <div class="stat-value">${activeTracks}</div>
                                    <div class="stat-label">Активных</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">✅</div>
                                <div>
                                    <div class="stat-value">${inStockTracks}</div>
                                    <div class="stat-label">В наличии</div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // Render tracks
                    if (tracks.length === 0) {
                        html += `
                            <div class="empty-state">
                                <div class="empty-state-icon">🔍</div>
                                <div style="font-weight:600;margin-bottom:8px;">Нет товаров</div>
                                <div style="opacity:0.6;">Добавьте товары в боте</div>
                            </div>
                        `;
                    } else {
                        tracks.forEach((track, index) => {
                            const history = track.history || [];
                            const chartId = `chart-${track.id}-${index}`;
                            
                            html += `
                                <div class="track-card">
                                    <div class="track-header">
                                        <div class="track-title">${escapeHtml(track.title)}</div>
                                        <span class="track-status ${track.in_stock ? 'in-stock' : 'out-of-stock'}">
                                            ${track.in_stock ? 'В наличии' : 'Нет в наличии'}
                                        </span>
                                    </div>
                                    
                                    <div class="track-info">
                                        <div class="track-info-item">
                                            <div class="track-info-label">Цена</div>
                                            <div class="track-info-value">${formatPrice(track.price)}</div>
                                        </div>
                                        <div class="track-info-item">
                                            <div class="track-info-label">Рейтинг</div>
                                            <div class="track-info-value">${formatRating(track.rating)}</div>
                                        </div>
                                    </div>
                                    
                                    <div class="track-actions">
                                        <button 
                                            class="btn ${track.is_active ? 'btn-secondary' : 'btn-primary'}"
                                            onclick="handleToggle(${track.id}, ${track.is_active}, this)"
                                        >
                                            ${track.is_active ? 'Пауза' : 'Включить'}
                                        </button>
                                        <a href="${escapeHtml(track.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                                            Открыть на WB
                                        </a>
                                    </div>
                                    
                                    <div class="chart-container" id="${chartId}"></div>
                                </div>
                            `;
                            
                            // Draw chart after DOM update
                            setTimeout(() => {
                                const container = document.getElementById(chartId);
                                if (container) {
                                    drawChart(container, history);
                                }
                            }, 0);
                        });
                    }
                    
                    app.innerHTML = html;
                    
                    // Setup MainButton for "Back to Bot" action
                    if (tg.MainButton) {
                        tg.MainButton.setText("ЗАКРЫТЬ");
                        tg.MainButton.onClick(() => {
                            tg.close();
                        });
                        // Show MainButton only if we have data
                        tg.MainButton.show();
                    }
                    
                    // Handle theme changes
                    tg.onEvent('themeChanged', () => {
                        // Force re-render with new theme colors
                        setTimeout(() => {
                            tracks.forEach((track, index) => {
                                const container = document.getElementById(`chart-${track.id}-${index}`);
                                if (container && container.querySelector('canvas')) {
                                    container.innerHTML = '';
                                    drawChart(container, track.history || []);
                                }
                            });
                        }, 100);
                    });
                    
                    // Handle viewport changes
                    tg.onEvent('viewportChanged', () => {
                        // Adjust layout if needed
                    });
                })
                .catch(error => {
                    let errorMessage = 'Ошибка загрузки данных';
                    if (error.message) {
                        errorMessage = error.message;
                    }
                    
                    app.innerHTML = `
                        <div class="error">
                            <div class="error-icon">❌</div>
                            <div style="font-weight:600;margin-bottom:8px;">Ошибка</div>
                            <div style="opacity:0.6;margin-bottom:16px;max-width:300px;">${escapeHtml(errorMessage)}</div>
                            <button class="btn btn-primary" onclick="location.reload()" style="min-width:150px;">
                                Повторить
                            </button>
                        </div>
                    `;
                    
                    // Hide MainButton on error
                    if (tg.MainButton) {
                        tg.MainButton.hide();
                    }
                });
        }
        
        /**
         * Escape HTML to prevent XSS attacks
         */
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Handle visibility changes (when user switches away from Mini App)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // Refresh data when user returns to Mini App
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });
        
        // Start rendering
        render();
    </script>
</body>
</html>
